name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        # Dependabot 이 만든 pull_request 에는 저장소 시크릿이 전달되지 않는다.
        # 조건이 없으면 모든 Dependabot PR 에서 이 스텝이 실패해 CI 가 상시 빨간색이 된다.
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get project name from package.json
        id: project_name
        run: |
          PROJECT_NAME=$(jq -r .name package.json)
          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # PR 빌드가 latest 태그를 덮어쓰지 않게 한다(gateway#184 P2-1 이 이 저장소를 빠뜨렸음).
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}:${{ github.sha }}

      # DevSecOps SCA pilot (architecture#15 / msa#155): scan the image we just
      # built/pushed for known OS + npm vulnerabilities. Report-only for now —
      # TODO: once findings are triaged, set exit-code: '1' with
      # severity: 'CRITICAL,HIGH' to actually gate the build/deploy.
      - name: Run Trivy vulnerability scanner
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}:${{ github.sha }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Upload Trivy scan results as workflow artifact
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: trivy-results-${{ github.sha }}
          path: trivy-results.sarif
          retention-days: 30

      - name: Upload Trivy scan results to GitHub Code Scanning
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4.37.7
        with:
          sarif_file: "trivy-results.sarif"

  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: [self-hosted, k3s-home]

    steps:
      - name: Deploy new image to K3s
        run: |
          /usr/local/bin/kubectl --kubeconfig=/home/leedohyun/.kube-ci/store-front-deployer.kubeconfig \
            set image deployment/store-front store-front=leedohyun1985/store.front:${{ github.sha }} -n customer

      - name: Wait for rollout
        run: |
          /usr/local/bin/kubectl --kubeconfig=/home/leedohyun/.kube-ci/store-front-deployer.kubeconfig \
            rollout status deployment/store-front -n customer --timeout=600s
